@media(prefers-color-scheme:light){:root{--bg:#f5f6f8;--panel:#fff;--panel2:#f0f2f5;--line:#dfe3e9;
 --ink:#12141a;--dim:#5b6472;--faint:#8b93a1;--go:#1e6fd9;--boa:#c33;--amex:#0d8f61;--warn:#a86b12}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;padding-bottom:44px}
.wrap{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 2px;letter-spacing:-.01em}
.sub{color:var(--dim);font-size:13px;margin-bottom:16px}
#q{width:100%;padding:15px 16px;font-size:17px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);outline:none}
#q:focus{border-color:var(--go)}
.tabs{display:flex;gap:5px;margin:14px 0;flex-wrap:wrap}
.tab{flex:1;min-width:88px;text-align:center;padding:9px 6px;border-radius:9px;background:var(--panel);border:1px solid var(--line);color:var(--dim);font-size:12.5px;cursor:pointer;user-select:none}
.tab.on{background:var(--panel2);color:var(--ink);border-color:var(--go)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.verdict{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.big{font-size:19px;font-weight:640;letter-spacing:-.01em}
.rate{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.GO{color:var(--go)}.BOA{color:var(--boa)}.AMEX{color:var(--amex)}
.why{color:var(--dim);font-size:13.5px;margin-top:6px}
.deal{margin-top:10px;padding:11px;border-radius:9px;background:var(--panel2);border-left:3px solid var(--warn)}
.deal.a{border-left-color:var(--amex)}.deal.g{border-left-color:var(--go)}.deal.b{border-left-color:var(--boa)}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);color:var(--dim);margin-right:5px}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.row:last-child{border-bottom:0}
.row .m{font-weight:560}
.row .r{font-weight:660;white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
.grp{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);margin:20px 0 6px}
.cap{color:var(--faint);font-size:12px}
.none{color:var(--dim);padding:20px;text-align:center;font-size:14px}
.note{font-size:12.5px;color:var(--faint);margin-top:14px;line-height:1.55}
.hide{display:none}
kbd{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:11px;font-family:inherit;color:var(--dim)}
.win{font-weight:700}
</style>
</head>

  <span class="rate ${C.cls}">${R.rate}</span><span class="tag">${esc(R.cat)}</span></div>`;
 if(R.why)h+=`<div class="why">${esc(R.why)}</div>`;
 ax.forEach(o=>h+=`<div class="deal a"><b class="AMEX">Amex Offer — ${esc(o[0])}</b><br>${esc(o[1])}${o[2]?` · up to <b>$${o[2].toFixed(2)}</b>`:""} · expires ${esc(o[3])}<br><span class="cap">✓ Already on your card — just pay with the Amex.</span></div>`);
 ub.forEach(o=>h+=`<div class="deal g"><b class="GO">U.S. Bank deal — ${esc(o[0])}</b><br>${esc(o[1])} back${o[2]?` · up to <b>$${o[2].toFixed(2)}</b>`:""}${o[3]?" · "+esc(o[3]):""}<br><span class="cap">⚠ NOT activated. Open the U.S. Bank app and tap ⊕ <b>before</b> you pay — no retroactive credit.</span></div>`);
 ba.forEach(o=>h+=`<div class="deal b"><b class="BOA">BankAmeriDeal — ${esc(o[0])}</b><br>${esc(o[1])}<br><span class="cap">⚠ NOT activated. If it's an online offer you must also <b>start from the BofA deals page</b> or it won't track.</span></div>`);
 if(ax.length&&ub.length)h+=`<div class="note"><b>Both cards have this merchant.</b> Only the card you swipe earns — take the bigger number above.</div>`;
 return h+`</div>`;
}
function search(){
 const raw=el('q').value.trim(), v=norm(raw);
 if(!raw){el('search').innerHTML=`<div class="none">Type a merchant to see which card to swipe.<br><br>
  Try <kbd>shake shack</kbd> <kbd>paramount</kbd> <kbd>costco</kbd> <kbd>cvs</kbd></div>`;return;}
 const ax=AX.filter(o=>norm(o[0]).includes(v)), ub=UB.filter(o=>norm(o[0]).includes(v)), ba=BA.filter(o=>norm(o[0]).includes(v));
 let idx=null;for(const k in M){if(norm(k).includes(v)||v.includes(norm(k))){idx=M[k];break;}}
 if(idx===null)idx=12;
 let out=ruleCard(idx,ax,ub,ba);
 if(!ax.length&&!ub.length&&!ba.length)out+=`<div class="note">No offer found for “${esc(raw)}” on any of the three programs — the answer above is the plain category rate. If it's plainly online, use the Amex: guessing online is nearly free.</div>`;
 el('search').innerHTML=out;
}
function renderConflict(){
 const LBL={AMEX:"Amex",GO:"Altitude Go",BOA:"BofA",SPLIT:"depends"};
 el('conflict').innerHTML=`<div class="card">`+CONF.map(c=>{
  const w=c[4];
  return `<div class="row"><div><span class="m">${esc(c[0])}</span>
   <div class="cap" style="margin-top:3px">Amex ${esc(c[1])} &nbsp;·&nbsp; U.S. Bank ${esc(c[2])} &nbsp;·&nbsp; BofA ${esc(c[3])}</div></div>
   <div class="r ${w==='SPLIT'?'':w} win">${LBL[w]}</div></div>`;}).join("")+`</div>
 <div class="note"><b>36 merchants appear on two or three programs.</b> Amex takes 23, Altitude Go 10, BofA 2,
 and one depends on basket size.<br><br>
 <b>Sam's Club flipped.</b> I previously called this for U.S. Bank on cap size — BofA's <b>$70 off a new
 membership</b> beats both U.S. Bank's $36 back and Amex's $24. That's now the single best Sam's Club play.<br><br>
 <b>Under Armour depends on spend:</b> Amex pays a flat $10 on $50+, BofA pays 7%. Crossover is about $143 —
 below that take the Amex, above it take the BofA.<br><br>
 The working rule: <b>Amex Offers first, then U.S. Bank, then BofA</b> — except for the eleven merchants above
 where that order loses.</div>`;
}
function renderRules(){
 el('rules').innerHTML=`<div class="card">`+RULES.map(R=>{const C=CARD[R.card];
  return `<div class="row"><div><span class="m">${esc(R.cat)}</span>${R.why?`<div class="cap" style="margin-top:3px">${esc(R.why)}</div>`:""}</div>
  <div class="r ${C.cls}">${C.label}<br><span style="font-size:15px">${R.rate}</span></div></div>`;}).join("")+`</div>
 <div class="note"><b>Caps that bite.</b> BofA’s 3% and 2% draw from ONE $2,500/quarter pool, then everything drops to the base rate. Amex’s 3% categories are capped at $6,000 of spend per calendar year each. Altitude Go’s 4% dining is capped at $2,000/quarter and drops to 1X past it.<br><br><b>Why a purchase lands in the wrong category</b>, in BofA’s words: &ldquo;Merchants, not Bank of America, categorize and submit purchases, so some purchases may not fall into the category where you might expect.&rdquo; It’s the merchant’s MCC — you can’t know in advance, you verify after the fact.</div>`;
}
function listRender(id,arr,fmt,foot){el(id).innerHTML=`<div class="card">`+arr.map(fmt).join("")+`</div>`+(foot||"");}
function renderAmex(){
 listRender('amex',AX,o=>`<div class="row"><div><span class="m">${esc(o[0])}</span>
  <div class="cap" style="margin-top:3px">${esc(o[1])} · expires ${esc(o[3])}</div></div>
  <div class="r AMEX">${o[2]?"$"+o[2].toFixed(2):"—"}</div></div>`,
 `<div class="note">Sorted by maximum value. Amex Offers must be added to the card <b>before</b> you spend — there is no retroactive credit. They’re allocated and vanish once enough cardholders claim them, so add on sight.</div>`);
}
function renderUsb(){
 listRender('usb',UB,o=>`<div class="row"><div><span class="m">${esc(o[0])}</span>
  <div class="cap" style="margin-top:3px">${o[2]?"max $"+o[2].toFixed(2):"cap not read"}${o[3]?" · "+esc(o[3]):""}</div></div>
  <div class="r" style="color:var(--warn)">${esc(o[1])}</div></div>`,
 `<div class="note">All credit only to a U.S. Bank card — for you, the Altitude Go. Caps shown where I read the
 offer detail before the session timed out; the rest run $4–$40.<br><br>
 Every deal here credits only to the Altitude Go.</div>`);
}
function renderBoa(){
 listRender('boa',BA,o=>`<div class="row"><span class="m">${esc(o[0])}</span>
  <div class="r BOA">${esc(o[1])}</div></div>`,
 `<div class="note"><b>683 offers total</b> — this is a merchant catalogue, not a short targeted list like the other two.
 Shown here are the 42 that overlap Amex or U.S. Bank plus the highest-value rest; search covers what's listed.
 Paid cash back this year: <b>$0.00</b>.<br><br>
 <b>Two different mechanics live in this list.</b> "% cash back" pays to the card. "Save $X" / "Save Now" is a
 discount at checkout, usually via a tracked link — you must start from the BofA deals page or it won't track.
 Most percentage offers are online-only for the same reason.</div>`);
}
function renderTodo(){
 const T=[["Amex — add offers on sight","Amex","Allocated and limited-quantity. They disappear once enough cardholders claim them, and there is no retroactive credit."],
 ["U.S. Bank — activate on demand","Altitude Go","Fixed expiry dates, not limited supply. Search the merchant here, then tap the plus in the U.S. Bank app before you pay."],
 ["BofA — activate, and start from their page","BofA","Online offers only track if the purchase begins on the BofA deals page. Activating alone is not enough for those."],
 ["Dining always goes to the Altitude Go","Altitude Go","4% including delivery, until $2,000/quarter."],
 ["Warehouse clubs always go to BofA","BofA","Amex is excluded at clubs, and US Costco takes Visa only."],
 ["Car rental goes on the Amex anyway","Amex","Reserve and pay in full on it, decline the counter CDW, and you get loss/damage cover — worth more than the rate you give up."]];
 listRender('todo',T,t=>`<div class="row"><div><span class="m">${esc(t[0])}</span>
  <div class="cap" style="margin-top:3px">${esc(t[2])}</div></div><div class="r cap">${esc(t[1])}</div></div>`,
 `<div class="note">Offer credit only ever pays on the card whose program owns it — there is no cross-crediting between issuers. When the same merchant appears twice, only the card you actually swipe earns.</div>`);
}
el('q').addEventListener('input',search);
document.querySelectorAll('.tab').forEach(t=>{t.onclick=()=>{
 document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');
 ['search','conflict','rules','amex','usb','boa','todo'].forEach(v=>el(v).classList.add('hide'));
 el(t.dataset.v).classList.remove('hide');};});
search();renderConflict();renderRules();renderAmex();renderUsb();renderBoa();renderTodo();
</script>
</body>
</html>
